<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test de repaso · HTML5</title><link rel="stylesheet" href="estilos.css"></head><body><a href="#contenido">Saltar al contenido</a><header><h1>Test final de HTML5 · 30 preguntas</h1><p>Selecciona una respuesta por pregunta. Al terminar recibirás tu puntuación y una explicación de cada respuesta.</p></header><nav><a href="index.html">Volver a las instrucciones</a> | <a href="modelo.html" target="_blank" rel="noopener">Ver modelo (otra pestaña)</a></nav><main id="contenido"><form id="quiz"><div id="preguntas"></div><button type="submit">Corregir mis respuestas</button> <button type="reset">Reiniciar test</button></form><section id="resultado" aria-live="polite" tabindex="-1"></section></main><footer><p>Repaso didáctico · HTML5, accesibilidad y usabilidad</p></footer>
<script>
'use strict';
const preguntas=[
['¿Qué declaración indica que el documento utiliza HTML5?',['<html5>','<!DOCTYPE html>','<meta html5>','<doctype=5>'],1,'<!DOCTYPE html> activa el modo estándar del navegador.'],
['¿Qué atributo de <html> indica el idioma principal?',['lang','charset','title','locale'],0,'lang="es" informa del idioma a lectores de pantalla y otros agentes.'],
['¿Dónde se coloca el título que aparece en la pestaña del navegador?',['<header>','<h1>','<title> dentro de <head>','<footer>'],2,'<title> es metadato del documento y se incluye en <head>.'],
['¿Qué etiqueta contiene el contenido visible principal del documento?',['<body>','<head>','<meta>','<title>'],0,'<body> contiene el contenido representado en la página.'],
['¿Para qué sirve <meta charset="utf-8">?',['Para añadir un vídeo','Para definir la codificación de caracteres','Para traducir la página','Para establecer el tamaño de fuente'],1,'UTF-8 permite representar correctamente numerosos caracteres y símbolos.'],
['¿Cuál es la finalidad de la etiqueta <main>?',['Agrupar los enlaces del pie','Marcar el contenido principal de la página','Crear una tabla','Mostrar un menú emergente'],1,'<main> identifica el contenido principal y normalmente debe existir uno visible por documento.'],
['¿Qué etiqueta representa una sección de navegación?',['<nav>','<aside>','<figure>','<mark>'],0,'<nav> agrupa los enlaces de navegación importantes.'],
['¿Qué diferencia caracteriza a <article>?',['Siempre contiene una imagen','Representa contenido autónomo o reutilizable','Solo puede usarse dentro de <footer>','Sustituye a todos los encabezados'],1,'Un artículo puede tener sentido de forma independiente, como una noticia o entrada.'],
['¿Qué orden de encabezados es el más lógico?',['<h1>, <h3>, <h2> sin jerarquía','Todos los títulos como <h1>','<h1> principal, <h2> secciones y <h3> subsecciones','Usar <strong> en vez de encabezados'],2,'Los encabezados expresan una estructura jerárquica, no solo un tamaño visual.'],
['¿Qué etiqueta crea un párrafo?',['<paragraph>','<p>','<text>','<br>'],1,'<p> delimita un párrafo; <br> solo introduce un salto de línea.'],
['¿Qué etiquetas crean una lista desordenada y sus elementos?',['<ol> y <dd>','<dl> y <li>','<ul> y <li>','<list> y <item>'],2,'<ul> contiene elementos <li> sin orden secuencial obligatorio.'],
['¿Qué etiqueta se utiliza para una lista numerada?',['<ol>','<ul>','<dl>','<nav>'],0,'<ol> representa una lista ordenada.'],
['¿Qué etiqueta define una celda de encabezado en una tabla?',['<td>','<tr>','<caption>','<th>'],3,'<th> representa encabezados de filas o columnas y admite el atributo scope.'],
['¿Qué atributo permite que una celda ocupe varias columnas?',['rowspan','colspan','spanrows','columns'],1,'colspan combina columnas; rowspan combina filas.'],
['¿Qué atributo permite que una celda ocupe varias filas?',['rowspan','colspan','multiline','rowgroup'],0,'rowspan indica el número de filas abarcadas por una celda.'],
['¿Qué etiqueta proporciona un título descriptivo a una tabla?',['<caption>','<label>','<legend>','<summary>'],0,'<caption> describe la tabla y facilita su comprensión.'],
['¿Qué atributo indica la dirección de destino de un enlace?',['src','alt','href','target'],2,'href indica el recurso al que apunta <a>.'],
['¿Cuál es un enlace relativo válido entre páginas de la misma carpeta?',['href="https://"','href="recursos.html"','src="recursos.html"','alt="recursos.html"'],1,'Los enlaces relativos facilitan la navegación dentro de un proyecto local.'],
['¿Qué atributo aporta una alternativa textual a una imagen?',['title','name','alt','caption'],2,'alt transmite el propósito o contenido de la imagen cuando no se ve.'],
['¿Qué valor de alt es adecuado para una imagen puramente decorativa?',['alt="imagen"','Omitir siempre alt','alt="decoración"','alt=""'],3,'alt="" permite que tecnologías de apoyo omitan imágenes decorativas.'],
['¿Qué etiquetas asocian una imagen con su pie descriptivo?',['<figure> y <figcaption>','<img> y <caption>','<picture> y <footer>','<aside> y <label>'],0,'<figure> agrupa contenido ilustrativo y <figcaption> su leyenda.'],
['¿Qué elemento se usa habitualmente para insertar un vídeo de YouTube?',['<audio>','<iframe>','<source> sin contenedor','<frameset>'],1,'YouTube proporciona un reproductor incrustado mediante iframe.'],
['¿Qué atributo mejora la identificación accesible de un iframe?',['width','allowfullscreen','title','loading'],2,'title describe el contenido del marco a quienes usan tecnologías de apoyo.'],
['¿Qué sintaxis corresponde a un comentario HTML?',['// comentario','/* comentario */','<!-- comentario -->','# comentario'],2,'Los comentarios HTML se escriben entre <!-- y --> y no se muestran como contenido visible.'],
['¿Cuál fue una aportación destacada de HTML5?',['Eliminar todos los enlaces','Introducir etiquetas semánticas y soporte nativo de audio y vídeo','Obligar a usar Flash','Sustituir CSS'],1,'HTML5 consolidó semántica moderna y elementos multimedia nativos.'],
['¿Cuál es una buena práctica de accesibilidad para enlaces?',['Escribir siempre «haz clic aquí»','Usar solo iconos sin texto','Utilizar textos que describan el destino','Abrir siempre pestañas nuevas'],2,'Un enlace descriptivo se entiende incluso fuera del contexto del párrafo.'],
['¿Qué permite un enlace «Saltar al contenido principal»?',['Cambiar el idioma','Evitar repetir la navegación al usar teclado','Descargar la página','Ocultar los encabezados'],1,'Facilita que usuarios de teclado accedan directamente al contenido.'],
['¿Qué afirmación diferencia accesibilidad y usabilidad?',['Son conceptos idénticos','La accesibilidad facilita el uso a personas con distintas capacidades y la usabilidad evalúa facilidad y eficacia de uso','La usabilidad solo afecta a móviles','La accesibilidad solo consiste en colores'],1,'Son conceptos relacionados pero distintos: acceso inclusivo y calidad de la experiencia de uso.'],
['¿Qué práctica favorece la navegación mediante teclado?',['Eliminar el indicador de foco','Utilizar elementos interactivos nativos y orden lógico','Usar solo eventos de ratón','Crear enlaces sin href'],1,'Los controles nativos y el orden del documento facilitan el acceso con teclado.'],
['¿Qué metaetiqueta ayuda a adaptar la página a pantallas móviles?',['<meta name="viewport" content="width=device-width, initial-scale=1">','<meta name="mobile" content="yes">','<meta charset="mobile">','<meta name="screen" content="auto">'],0,'viewport establece la anchura de visualización adaptada al dispositivo.']
];
const contenedor=document.getElementById('preguntas'),resultado=document.getElementById('resultado');
for(let i=0;i<preguntas.length;i++){const [pregunta,opciones]=preguntas[i];const fieldset=document.createElement('fieldset');fieldset.style.marginBottom='1rem';const legend=document.createElement('legend');legend.textContent=`${i+1}. ${pregunta}`;fieldset.append(legend);opciones.forEach((op,j)=>{const label=document.createElement('label');label.style.display='block';const input=document.createElement('input');input.type='radio';input.name=`p${i}`;input.value=j;label.append(input,document.createTextNode(' '+String.fromCharCode(65+j)+'. '+op));fieldset.append(label)});const feedback=document.createElement('p');feedback.id=`feedback${i}`;fieldset.append(feedback);contenedor.append(fieldset)}
document.getElementById('quiz').addEventListener('submit',e=>{e.preventDefault();let correctas=0,respondidas=0;preguntas.forEach(([q,opciones,correcta,exp],i)=>{const marcada=document.querySelector(`input[name="p${i}"]:checked`);const feedback=document.getElementById(`feedback${i}`);if(marcada)respondidas++;const acierto=marcada&&Number(marcada.value)===correcta;if(acierto)correctas++;feedback.textContent=`${acierto?'Correcto':'Incorrecto o sin responder'}. Respuesta: ${String.fromCharCode(65+correcta)}. ${exp}`});resultado.innerHTML='';const titulo=document.createElement('h2');titulo.textContent=`Resultado: ${correctas} de 30 (${Math.round(correctas/30*100)} %) `;const texto=document.createElement('p');texto.textContent=`Preguntas respondidas: ${respondidas}/30. Revisa las explicaciones que aparecen debajo de cada pregunta.`;resultado.append(titulo,texto);resultado.focus()});document.getElementById('quiz').addEventListener('reset',()=>{resultado.replaceChildren();preguntas.forEach((_,i)=>document.getElementById(`feedback${i}`).textContent='')});
</script></body></html>
